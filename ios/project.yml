name: FlexFundKids
options:
  bundleIdPrefix: com.flexfund
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  FlexFundKids:
    type: application
    platform: iOS
    sources:
      - path: FlexFundKids
    info:
      path: FlexFundKids/Info.plist
      properties:
        CFBundleDisplayName: FlexFund Kids
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: GradientStart
          UIImageName: Mascot
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Bangers-Regular.ttf
        NSFaceIDUsageDescription: Unlock FlexFund Kids quickly with Face ID instead of typing your PIN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.flexfund.kids
            CFBundleURLSchemes:
              - flexfundkids
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flexfund.kids
        PRODUCT_NAME: FlexFundKids
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  FlexFundKidsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlexFundKidsTests
    dependencies:
      - target: FlexFundKids
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.flexfund.kids.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FlexFundKids.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FlexFundKids
        BUNDLE_LOADER: $(TEST_HOST)
  FlexFundKidsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FlexFundKidsUITests
    dependencies:
      - target: FlexFundKids
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.flexfund.kids.uitests
        TEST_TARGET_NAME: FlexFundKids
schemes:
  FlexFundKids:
    build:
      targets:
        FlexFundKids: all
        FlexFundKidsTests: [test]
        FlexFundKidsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - FlexFundKidsTests
        - FlexFundKidsUITests
    archive:
      config: Release

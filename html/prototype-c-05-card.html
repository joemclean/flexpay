  <script>
// Prototype player, inlined into every standalone screen page: fits the screen to the
// window, follows hotspots to sibling pages and adds keyboard shortcuts.
//   ?chrome=0    hide the toolbar          ?hotspots=1  always outline hotspots
//   ?fit=none    show at 100% size
;(function () {
  var root = document.documentElement
  var params = new URLSearchParams(location.search)
  var framed
  try {
    framed = window.self !== window.top
  } catch (e) {
    framed = true
  }
  if (framed) root.classList.add('ff-framed')
  if (params.get('chrome') === '0') root.classList.add('ff-no-chrome')

  var stage = document.querySelector('.ff-stage')
  var frame = document.querySelector('.ff-frame')
  var screen = document.querySelector('.ff-screen')
  var hotspotsButton = document.querySelector('.ff-toolbar-hotspots')
  var width = parseFloat(frame.getAttribute('data-width'))
  var height = parseFloat(frame.getAttribute('data-height'))

  // Display options follow you from page to page.
  var carried = new URLSearchParams()
  ;['chrome', 'fit', 'hotspots'].forEach(function (key) {
    if (params.has(key)) carried.set(key, params.get(key))
  })
  var query = carried.toString() ? '?' + carried.toString() : ''
  document.querySelectorAll('.ff-toolbar-pager a').forEach(function (a) {
    a.setAttribute('href', a.getAttribute('href') + query)
  })

  function fit() {
    var style = getComputedStyle(stage)
    var availableWidth = stage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight)
    var availableHeight = stage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom)
    var scale = params.get('fit') === 'none' ? 1 : Math.min(availableWidth / width, availableHeight / height)
    if (!framed) scale = Math.min(scale, 1) // don't blow up small bitmaps in a big window
    scale = Math.max(scale, 0.05)
    frame.style.width = width * scale + 'px'
    frame.style.height = height * scale + 'px'
    screen.style.transform = 'scale(' + scale + ')'
  }
  fit()
  window.addEventListener('resize', fit)

  function follow(hotspot) {
    location.href = hotspot.getAttribute('data-ff-href') + query
  }

  function setHotspots(on) {
    screen.classList.toggle('ff-hotspots', on)
    if (hotspotsButton) hotspotsButton.setAttribute('aria-pressed', String(on))
  }
  setHotspots(params.get('hotspots') === '1')
  if (hotspotsButton) {
    hotspotsButton.addEventListener('click', function () {
      setHotspots(!screen.classList.contains('ff-hotspots'))
    })
  }

  // Clicking somewhere that isn't a hotspot briefly reveals where the hotspots are.
  var flashTimer
  function flash() {
    screen.classList.add('ff-flash')
    clearTimeout(flashTimer)
    flashTimer = setTimeout(function () {
      screen.classList.remove('ff-flash')
    }, 700)
  }

  document.addEventListener('click', function (event) {
    var hotspot = event.target.closest('[data-ff-href]')
    if (hotspot) {
      event.preventDefault()
      follow(hotspot)
    } else if (screen.contains(event.target) && !event.target.closest('input')) {
      flash()
    }
  })

  document.addEventListener('keydown', function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey || event.defaultPrevented) return
    var target = event.target
    if (target.closest && target.closest('input, textarea, select')) return
    if ((event.key === 'Enter' || event.key === ' ') && target.matches && target.matches('[data-ff-href]')) {
      event.preventDefault()
      follow(target)
      return
    }
    var rel = event.key === 'ArrowRight' ? 'next' : event.key === 'ArrowLeft' ? 'prev' : null
    if (rel) {
      var link = document.querySelector('.ff-toolbar-pager a[rel="' + rel + '"]')
      if (link) location.href = link.href
    } else if (event.key === 'h' || event.key === 'H') {
      setHotspots(!screen.classList.contains('ff-hotspots'))
    }
  })
})()
  </script>
